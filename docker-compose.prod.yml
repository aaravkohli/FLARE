# =============================================================================
# docker-compose.prod.yml — REAL MODE
# Requires Open vSwitch and Ryu. See README for OVS setup steps.
# =============================================================================

networks:
  antijam-net:
    driver: bridge

volumes:
  experiments:
  logs:
  fl-results:
  fl-runtime:

services:

  fl-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.fl
    container_name: fl-server
    networks: [antijam-net]
    ports:
      - "8090:8090"
    volumes:
      - ${MODEL_DIR:-./models}:/app/models
      - fl-results:/app/results
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8090))\" 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  fl-client-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.fl
    networks: [antijam-net]
    volumes:
      - ${MODEL_DIR:-./models}:/app/models
      - ${PROCESSED_DATA_DIR:?Set PROCESSED_DATA_DIR}:/app/datasets/processed:ro
      - fl-runtime:/app/client-runtime
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    environment:
      - PYTHONPATH=/app
      - FLARE_CLIENT_MANAGER_STATUS=/app/client-runtime/fl_clients.json
    command: python -m fl.client_manager --server-address fl-server:8090 --real --require-real-data --processed-dir /app/datasets/processed --status-path /app/client-runtime/fl_clients.json
    restart: on-failure
    depends_on:
      fl-server:
        condition: service_healthy

  # ── REAL Ryu SDN Controller (Python 3.9 image) ────────────────────────────
  # Ensure OVS is running on host: ovs-vsctl set-controller br0 tcp:127.0.0.1:6633
  sdn-controller:
    build:
      context: .
      dockerfile: docker/Dockerfile.sdn
    container_name: sdn-controller
    networks: [antijam-net]
    ports:
      - "8080:8080"   # REST API
      - "6633:6633"   # OpenFlow
    volumes:
      - logs:/app/logs
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    environment:
      - PYTHONPATH=/app
      - AJ_ENV=production
      - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:?Set AJ_SDN_TOKEN}
    command: ryu-manager sdn/controller.py --ofp-tcp-listen-port 6633
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: flare-api
    networks: [antijam-net]
    ports:
      - "8000:8000"
    volumes:
      - ${MODEL_DIR:-./models}:/app/models:ro
      - experiments:/app/experiments
      - logs:/app/logs
      - fl-results:/app/results:ro
      - fl-runtime:/app/client-runtime:ro
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml
    environment:
      - PYTHONPATH=/app
      - AJ_ENV=production
      - MODE=real
      - AJ_SDN_MODE=ryu
      - SDN_HOST=sdn-controller
      - AJ_READINESS_HISTORY_LIMIT=${AJ_READINESS_HISTORY_LIMIT:-100}
      - AJ_SECRET_KEY=${AJ_SECRET_KEY:?Set AJ_SECRET_KEY}
      - AJ_ADMIN_USERNAME=${AJ_ADMIN_USERNAME:-admin}
      - AJ_ADMIN_PASSWORD=${AJ_ADMIN_PASSWORD:?Set AJ_ADMIN_PASSWORD}
      - AJ_CORS_ORIGINS=${AJ_CORS_ORIGINS:?Set AJ_CORS_ORIGINS}
      - FLARE_CLIENT_MANAGER_STATUS=/app/client-runtime/fl_clients.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: flare-orchestrator
    networks: [antijam-net]
    volumes:
      - ${MODEL_DIR:-./models}:/app/models:ro
      - experiments:/app/experiments
      - logs:/app/logs
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    environment:
      - PYTHONPATH=/app
      - MODE=real
      - AJ_SDN_MODE=ryu
      - SDN_HOST=sdn-controller
      - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:?Set AJ_SDN_TOKEN}
      - AJ_SENSOR_API_URL=${AJ_SENSOR_API_URL:?Set AJ_SENSOR_API_URL}
    depends_on:
      sdn-controller:
        condition: service_healthy
    restart: unless-stopped
    command: python -m orchestrator.loop

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
    container_name: flare-frontend
    networks: [antijam-net]
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Mininet virtual network topology emulation ────────────────────────────
  mininet:
    profiles: ["packet-validation"]
    build:
      context: .
      dockerfile: docker/Dockerfile.mininet
    container_name: mininet
    privileged: true
    networks: [antijam-net]
    volumes:
      - logs:/app/logs
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    depends_on:
      sdn-controller:
        condition: service_healthy
    restart: unless-stopped
