# =============================================================================
# docker-compose.dev.yml — SIMULATION MODE
# All services use mock SDN and synthetic data.
# No Open vSwitch or real RF hardware required.
# =============================================================================

networks:
  antijam-net:
    driver: bridge

volumes:
  experiments:
  logs:
  fl-results:
  byzantine-state:
  fl-runtime:

services:

  # ── FL Server ─────────────────────────────────────────────────────────────
  fl-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.fl
    container_name: fl-server
    networks: [antijam-net]
    ports:
      - "8090:8090"
    volumes:
      - ${MODEL_DIR:-./models}:/app/models
      - fl-results:/app/results
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8090))\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Fleet-aware FL client manager ─────────────────────────────────────────
  fl-client-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.fl
    container_name: fl-client-manager
    networks: [antijam-net]
    volumes:
      - ${MODEL_DIR:-./models}:/app/models
      - byzantine-state:/app/runtime
      - fl-runtime:/app/client-runtime
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    environment:
      - PYTHONPATH=/app
      - FLARE_BYZANTINE_STATE_PATH=/app/runtime/byzantine_state.json
      - FLARE_CLIENT_MANAGER_STATUS=/app/client-runtime/fl_clients.json
    command: python -m fl.client_manager --server-address fl-server:8090 --status-path /app/client-runtime/fl_clients.json
    depends_on:
      fl-server:
        condition: service_healthy

  # ── Mock SDN Controller ────────────────────────────────────────────────────
  mock-sdn:
    build:
      context: .
      dockerfile: docker/Dockerfile.sdn
    container_name: mock-sdn
    networks: [antijam-net]
    ports:
      - "8080:8080"
    volumes:
      - logs:/app/logs
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    environment:
      - PYTHONPATH=/app
      - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:-antijam-development-sdn-token}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: flare-api
    networks: [antijam-net]
    ports:
      - "8000:8000"
    volumes:
      - ${MODEL_DIR:-./models}:/app/models:ro
      - experiments:/app/experiments
      - logs:/app/logs
      - fl-results:/app/results:ro
      - byzantine-state:/app/runtime
      - fl-runtime:/app/client-runtime:ro
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml
    environment:
      - PYTHONPATH=/app
      - MODE=simulation
      - AJ_SDN_MODE=mock
      - SDN_HOST=mock-sdn
      - AJ_READINESS_HISTORY_LIMIT=${AJ_READINESS_HISTORY_LIMIT:-100}
      - AJ_SECRET_KEY=${AJ_SECRET_KEY:-antijam-development-secret-do-not-use-in-production}
      - AJ_ADMIN_USERNAME=${AJ_ADMIN_USERNAME:-admin}
      - AJ_ADMIN_PASSWORD=${AJ_ADMIN_PASSWORD:-antijam2026}
      - AJ_CORS_ORIGINS=${AJ_CORS_ORIGINS:-http://localhost:5173}
      - FLARE_BYZANTINE_STATE_PATH=/app/runtime/byzantine_state.json
      - FLARE_CLIENT_MANAGER_STATUS=/app/client-runtime/fl_clients.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000

  # ── Orchestrator ──────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: flare-orchestrator
    networks: [antijam-net]
    volumes:
      - ${MODEL_DIR:-./models}:/app/models:ro
      - experiments:/app/experiments
      - logs:/app/logs
      - ./config/fleet_registry.yaml:/app/config/fleet_registry.yaml:ro
    environment:
      - PYTHONPATH=/app
      - MODE=simulation
      - AJ_SDN_MODE=mock
      - SDN_HOST=mock-sdn
      - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:-antijam-development-sdn-token}
    depends_on:
      mock-sdn:
        condition: service_healthy
    command: python -m orchestrator.loop

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: flare-frontend
    networks: [antijam-net]
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  # ── Redis (optional pub/sub) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [antijam-net]
    ports:
      - "6379:6379"
    profiles: ["redis"]   # only starts if --profile redis is passed
