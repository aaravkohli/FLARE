# Controlled packet simulation. Ryu remains in docker-compose.prod.yml.
networks:
  antijam-net:
    driver: bridge
volumes:
  experiments: null
  logs: null
  fl-results: null
  byzantine-state: null
  fl-runtime: null
  swarm-session: null
services:
  fl-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.fl
    container_name: fl-server
    networks:
    - antijam-net
    ports:
    - ${FL_SERVER_PORT:-8090}:8090
    volumes:
    - ${MODEL_DIR:-./models}:/app/models
    - fl-results:/app/results
    - ./config:/app/config:ro
    - swarm-session:/app/mission
    environment:
    - PYTHONPATH=/app
    - FLARE_SWARM_ENABLED=1
    - FLARE_FLEET_REGISTRY=/app/mission/fleet_registry.yaml
    - FLARE_SIMULATION_URL=http://mock-sdn:8080
    - FLARE_FL_POOL_PLAN=/app/mission/pool.json
    - FLARE_CLIENT_STATE_DIR=/app/mission/client_state
    - FLARE_PERSONALIZED_DIR=/app/mission/personalized
    - FLARE_FL_CANDIDATE=/app/mission/fl_candidate.pth
    - FLARE_FL_METRICS_JSON=/app/mission/fl_metrics.json
    - FLARE_FL_METRICS_CSV=/app/mission/fl_metrics.csv
    - FLARE_FL_TRUST_STATE=/app/mission/trust.json
    - FLARE_CLIENT_MANAGER_STATUS=/app/mission/fl_clients.json
    - FLARE_BYZANTINE_STATE_PATH=/app/mission/byzantine.json
    - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:-antijam-development-sdn-token}
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import socket; s=socket.socket(); s.connect(('localhost',8090))"
        2>/dev/null && echo ok || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      swarm-init:
        condition: service_completed_successfully
      mock-sdn:
        condition: service_healthy
  fl-client-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.fl
    container_name: fl-client-manager
    networks:
    - antijam-net
    volumes:
    - ${MODEL_DIR:-./models}:/app/models
    - byzantine-state:/app/runtime
    - fl-runtime:/app/client-runtime
    - ./config:/app/config:ro
    - swarm-session:/app/mission
    environment:
    - PYTHONPATH=/app
    - FLARE_SWARM_ENABLED=1
    - FLARE_FLEET_REGISTRY=/app/mission/fleet_registry.yaml
    - FLARE_SIMULATION_URL=http://mock-sdn:8080
    - FLARE_FL_POOL_PLAN=/app/mission/pool.json
    - FLARE_CLIENT_STATE_DIR=/app/mission/client_state
    - FLARE_PERSONALIZED_DIR=/app/mission/personalized
    - FLARE_FL_CANDIDATE=/app/mission/fl_candidate.pth
    - FLARE_FL_METRICS_JSON=/app/mission/fl_metrics.json
    - FLARE_FL_METRICS_CSV=/app/mission/fl_metrics.csv
    - FLARE_FL_TRUST_STATE=/app/mission/trust.json
    - FLARE_CLIENT_MANAGER_STATUS=/app/mission/fl_clients.json
    - FLARE_BYZANTINE_STATE_PATH=/app/mission/byzantine.json
    - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:-antijam-development-sdn-token}
    command: python -m fl.client_manager --server-address fl-server:8090 --status-path
      /app/mission/fl_clients.json
    depends_on:
      fl-server:
        condition: service_healthy
      swarm-init:
        condition: service_completed_successfully
      mock-sdn:
        condition: service_healthy
  mock-sdn:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulation
    container_name: mock-sdn
    networks:
    - antijam-net
    ports:
    - ${SDN_PORT:-8080}:8080
    volumes:
    - logs:/app/logs
    - ./config:/app/config:ro
    - swarm-session:/app/mission
    environment:
    - PYTHONPATH=/app
    - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:-antijam-development-sdn-token}
    - FLARE_SWARM_ENABLED=1
    - FLARE_FLEET_REGISTRY=/app/mission/fleet_registry.yaml
    - FLARE_SIMULATION_URL=http://mock-sdn:8080
    - FLARE_FL_POOL_PLAN=/app/mission/pool.json
    - FLARE_CLIENT_STATE_DIR=/app/mission/client_state
    - FLARE_PERSONALIZED_DIR=/app/mission/personalized
    - FLARE_FL_CANDIDATE=/app/mission/fl_candidate.pth
    - FLARE_FL_METRICS_JSON=/app/mission/fl_metrics.json
    - FLARE_FL_METRICS_CSV=/app/mission/fl_metrics.csv
    - FLARE_FL_TRUST_STATE=/app/mission/trust.json
    - FLARE_CLIENT_MANAGER_STATUS=/app/mission/fl_clients.json
    - FLARE_BYZANTINE_STATE_PATH=/app/mission/byzantine.json
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      swarm-init:
        condition: service_completed_successfully
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: flare-api
    networks:
    - antijam-net
    ports:
    - ${API_PORT:-8000}:8000
    volumes:
    - ${MODEL_DIR:-./models}:/app/models:ro
    - experiments:/app/experiments
    - logs:/app/logs
    - fl-results:/app/results:ro
    - byzantine-state:/app/runtime
    - fl-runtime:/app/client-runtime:ro
    - ./config:/app/config
    - swarm-session:/app/mission
    environment:
    - PYTHONPATH=/app
    - MODE=simulation
    - AJ_SDN_MODE=mock
    - DATABASE_PATH=/app/mission/decisions.db
    - SDN_HOST=mock-sdn
    - AJ_READINESS_HISTORY_LIMIT=${AJ_READINESS_HISTORY_LIMIT:-100}
    - AJ_SECRET_KEY=${AJ_SECRET_KEY:-antijam-development-secret-do-not-use-in-production}
    - AJ_ADMIN_USERNAME=${AJ_ADMIN_USERNAME:-admin}
    - AJ_ADMIN_PASSWORD=${AJ_ADMIN_PASSWORD:-antijam2026}
    - AJ_CORS_ORIGINS=${AJ_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    - FLARE_SWARM_ENABLED=1
    - FLARE_FLEET_REGISTRY=/app/mission/fleet_registry.yaml
    - FLARE_SIMULATION_URL=http://mock-sdn:8080
    - FLARE_FL_POOL_PLAN=/app/mission/pool.json
    - FLARE_CLIENT_STATE_DIR=/app/mission/client_state
    - FLARE_PERSONALIZED_DIR=/app/mission/personalized
    - FLARE_FL_CANDIDATE=/app/mission/fl_candidate.pth
    - FLARE_FL_METRICS_JSON=/app/mission/fl_metrics.json
    - FLARE_FL_METRICS_CSV=/app/mission/fl_metrics.csv
    - FLARE_FL_TRUST_STATE=/app/mission/trust.json
    - FLARE_CLIENT_MANAGER_STATUS=/app/mission/fl_clients.json
    - FLARE_BYZANTINE_STATE_PATH=/app/mission/byzantine.json
    - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:-antijam-development-sdn-token}
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    depends_on:
      swarm-init:
        condition: service_completed_successfully
      mock-sdn:
        condition: service_healthy
  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: flare-orchestrator
    networks:
    - antijam-net
    volumes:
    - ${MODEL_DIR:-./models}:/app/models:ro
    - experiments:/app/experiments
    - logs:/app/logs
    - ./config:/app/config:ro
    - swarm-session:/app/mission
    environment:
    - PYTHONPATH=/app
    - MODE=simulation
    - AJ_SDN_MODE=mock
    - DATABASE_PATH=/app/mission/decisions.db
    - SDN_HOST=mock-sdn
    - AJ_SDN_TOKEN=${AJ_SDN_TOKEN:-antijam-development-sdn-token}
    - FLARE_SWARM_ENABLED=1
    - FLARE_FLEET_REGISTRY=/app/mission/fleet_registry.yaml
    - FLARE_SIMULATION_URL=http://mock-sdn:8080
    - FLARE_FL_POOL_PLAN=/app/mission/pool.json
    - FLARE_CLIENT_STATE_DIR=/app/mission/client_state
    - FLARE_PERSONALIZED_DIR=/app/mission/personalized
    - FLARE_FL_CANDIDATE=/app/mission/fl_candidate.pth
    - FLARE_FL_METRICS_JSON=/app/mission/fl_metrics.json
    - FLARE_FL_METRICS_CSV=/app/mission/fl_metrics.csv
    - FLARE_FL_TRUST_STATE=/app/mission/trust.json
    - FLARE_CLIENT_MANAGER_STATUS=/app/mission/fl_clients.json
    - FLARE_BYZANTINE_STATE_PATH=/app/mission/byzantine.json
    depends_on:
      mock-sdn:
        condition: service_healthy
      swarm-init:
        condition: service_completed_successfully
    command: python -m orchestrator.loop
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: flare-frontend
    networks:
    - antijam-net
    ports:
    - ${FRONTEND_PORT:-5173}:80
    depends_on:
      api:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
    - antijam-net
    ports:
    - 6379:6379
    profiles:
    - redis
  swarm-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulation
    volumes:
    - swarm-session:/app/mission
    - ./config:/app/config:ro
    command: python -m simulation.swarm.session --destination /app/mission/fleet_registry.yaml
