name: SDN integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sdn-integration.yml"
      - "config/sdn_config.yaml"
      - "docker/Dockerfile.mininet"
      - "docker/Dockerfile.sdn"
      - "scripts/sdn_smoke_test.sh"
      - "sdn/**"
  pull_request:
    paths:
      - ".github/workflows/sdn-integration.yml"
      - "config/sdn_config.yaml"
      - "docker/Dockerfile.mininet"
      - "docker/Dockerfile.sdn"
      - "scripts/sdn_smoke_test.sh"
      - "sdn/**"

permissions:
  contents: read

concurrency:
  group: sdn-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ryu-mininet-smoke:
    name: Ryu and Mininet failover smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run privileged SDN integration test
        run: bash scripts/sdn_smoke_test.sh
