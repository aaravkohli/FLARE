name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python correctness and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Compile first-party Python modules
        run: >-
          python -m compileall -q
          api fl orchestrator rl scripts sdn simulation tests

      - name: Run regression suite
        env:
          AJ_ENV: test
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Frontend unit tests
        run: npm test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  browser-smoke:
    name: Isolated production browser smoke (missing models)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install isolated service dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          venv/bin/python -m pip install -r requirements.txt
          npm --prefix frontend-react ci
          cd frontend-react
          npx playwright install --with-deps chromium
      - name: Exercise studies, safeguarded control and unavailable-model states
        env:
          FLARE_TEST_PRODUCTION: '1'
          FLARE_TEST_MISSING_MODELS: '1'
          FLARE_ARTIFACT_DIR: /tmp/flare-browser-artifacts
        run: npm --prefix frontend-react run test:browser -- adaptive-study.spec.ts resilience-controller.spec.ts autonomous-recovery.spec.ts mission-requests.spec.ts
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: |
            frontend-react/test-results
            /tmp/flare-browser-artifacts

  deployment-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate development composition
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate production composition
        env:
          AJ_SECRET_KEY: ci-production-secret-key-at-least-32-characters
          AJ_ADMIN_PASSWORD: ci-production-password
          AJ_CORS_ORIGINS: https://example.com
          AJ_SDN_TOKEN: ci-sdn-token-at-least-24-characters
          AJ_SENSOR_API_URL: http://sensor.example:9000
          PROCESSED_DATA_DIR: ./datasets/processed
          VITE_API_BASE_URL: https://api.example.com
        run: docker compose -f docker-compose.prod.yml config --quiet
