async_fl:
  buffer_size: 4
  enabled: false
  max_staleness: 10
  staleness_alpha: 1.0
client_selection:
  combined:
    poco_weight: 0.6
    ucb_weight: 0.4
  enabled: false
  poco:
    candidate_multiplier: 2
  strategy: combined
  ucb:
    beta: 0.5
compression:
  enabled: false
  quantize:
    bits: 8
    stochastic: false
  strategy: topk
  topk:
    error_feedback: true
    ratio: 0.1
data:
  sequence_stride: 1
  split_seed: 42
  test_fraction: 0.2
differential_privacy:
  client_side:
    delta: 1.0e-05
    enabled: false
    epsilon: 5.0
    max_grad_norm: 1.0
    noise_multiplier: 1.1
    rdp_alpha_orders:
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
  enabled: false
  server_side:
    enabled: true
    noise_scale: 0.01
    sensitivity: 5.0
distillation:
  alpha_kd: 0.7
  enabled: true
  kd_epochs: 5
  kd_every_n_rounds: 10
  kd_lr: 0.001
  proxy_samples: 500
  temperature: 3.0
drift_detection:
  action: flag
  combined_threshold: 0.5
  cosine:
    enabled: true
    threshold: 0.3
  enabled: true
  ks_p_threshold: 0.05
  loss_spike:
    enabled: true
    ratio_threshold: 2.0
  weights:
    cosine: 0.4
    ks: 0.3
    loss_spike: 0.3
federation:
  fraction_fit: 1.0
  min_clients: 2
  num_rounds: 30
  server_address: 0.0.0.0:8090
lifecycle:
  checkpoint_promotion_threshold: 0.85
  min_clients_for_retrain: 2
  retrain_interval_minutes: 60
model:
  dropout: 0.2
  hidden_size: 64
  input_features: 5
  num_attack_classes: 5
  num_layers: 2
  num_paths: 3
  sequence_len: 10
paths:
  checkpoint_save: models/fl_model_checkpoint.pth
  metrics_csv: results/fl_advanced_metrics.csv
  metrics_json: results/fl_metrics_snapshot.json
  model_save: models/fl_model.pth
  personalized_models: models/personalized
personalization:
  enabled: true
  head_only: true
  lambda_prox: 0.1
  local_adapt_steps: 3
security:
  anomaly_z_threshold: 2.5
  clip_norm: 5.0
  trim_ratio: 0.1
  use_trimmed_mean: true
training:
  batch_size: 64
  learning_rate: 0.0005
  local_epochs: 5
  loss_weight_attack: 0.5
  loss_weight_confidence: 0.2
  loss_weight_threat: 2.0
trust:
  alpha: 0.9
  enabled: true
  initial_trust: 1.0
  participation_bonus: 0.05
  quarantine_rounds: 3
  tau_min: 0.2
