# Controlled simulation parameters, not field-calibrated UAV/RF specifications.
default_count: 30
max_count: 100
seed: 42
topology: self_healing_mesh
topology_mode: auto
# Simulation-clock policy. Resource efficiency is a proxy, not calibrated energy.
adaptive_topology:
  evaluation_s: 1.0
  window_s: 10.0
  minimum_observations: 8
  improvement: 0.08
  consecutive_wins: 3
  cooldown_s: 15.0
  emergency_loss: 0.10
  emergency_rebuilds: 2
  emergency_interval_s: 2.0
  blacklist_s: 30.0
  drain_s: 1.0
  validation_rebuilds: 2
  headroom: 0.20
  transition_penalty: 0.05
  weights: {reliability: 0.35, latency: 0.25, capacity: 0.25, efficiency: 0.15}
formation: distributed
fixed_step_s: 0.05
network_interval_s: 0.2
discovery_timeout_s: 0.6
radio:
  range_m: 350.0
  reference_rssi_dbm: -36.0
  path_loss_exponent: 2.2
  noise_dbm: -100.0
  bandwidth_mbps: 12.0
  minimum_sinr_db: 4.0
  max_loss: 0.35
  propagation_ms: 8.0
packets:
  queue_limit: 64
  capacity: 10000
  ttl_s: 20.0
  retries: 3
  jitter_ms: 2.0
  retry_backoff_ms: 2.0
fl:
  client_pool_size: 5
  transfer_timeout_s: 90.0
# Opt-in only. Fixed experiments explicitly pin balanced_v1.
adaptive_policy: balanced_v1
resilience:
  freshness_s: 3.0
  fragment_bytes: 4096
  max_report_bytes: 65536
  protected_airtime_share: 0.10
  packet_transitions: true
  observation_guard: true
  protected_scheduling: true

# Individual Mesh service assistance is independent of flight autonomy.
affected_uav_assist: false
