environment:
  latency_window: 3
  max_steps: 500
  num_paths: 3
  obs_dim: 14
runtime:
  preferred_contract: routing_state_v3
  v3_model_path: models/rl_model_v3.zip
routing_v3:
  observation_definition: routing_state_v3
  obs_dim: 18
  action_count: 4
  all_unsafe_behavior: hold
  hold_penalty: 0.35
  containment_hold_threshold: 0.72
paths:
  final_model_save: models/rl_final_model.zip
  log_dir: logs/rl_tensorboard
  model_save: models/rl_model.zip
  ns3_trace_csv: datasets/processed/rl_trace_ns3.csv
  synchronized_trace_csv: datasets/processed/rl_trace_iid_train.csv
  synchronized_trace_eval_csv: datasets/processed/rl_trace_iid_eval.csv
  sac_model_save: models/rl_sac_model.pth
reward:
  w_delay: 0.6
  w_energy: 0.3
  w_loss: 0.8
  w_switch: 0.15
  w_throughput: 1.0
safety:
  # Scores above this value are not considered safe for normal routing.
  threat_threshold: 0.8
  # The SDN layer has no disconnect/hold action. Preserve connectivity via the
  # lowest-threat route and expose the degraded state as no_safe_route=true.
  all_unsafe_behavior: least_risk_route
training:
  algo: dqn
  batch_size: 64
  buffer_size: 20000
  learning_rate: 0.0001
  seed: 42
  evaluation_episodes: 50
  evaluation_seed: 42000
  sac:
    alpha_lr: 0.0003
    critic_lr: 0.0003
    initial_alpha: 0.2
    policy_lr: 0.0003
    target_entropy_ratio: 0.98
    tau: 0.005
  total_timesteps: 100000
  verbose: 1
