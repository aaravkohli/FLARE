environment:
  latency_window: 3
  max_steps: 500
  num_paths: 3
  obs_dim: 14
paths:
  log_dir: logs/rl_tensorboard
  model_save: models/rl_model.zip
  real_data_csv: datasets/processed/test.csv
  sac_model_save: models/rl_sac_model.pth
reward:
  w_delay: 0.6
  w_energy: 0.3
  w_loss: 0.8
  w_switch: 0.15
  w_throughput: 1.0
training:
  algo: dqn
  batch_size: 64
  buffer_size: 20000
  double_q: true
  dueling: true
  learning_rate: 0.0001
  n_step: 3
  prioritized_replay: true
  prioritized_replay_alpha: 0.6
  prioritized_replay_beta0: 0.4
  sac:
    alpha_lr: 0.0003
    critic_lr: 0.0003
    initial_alpha: 0.2
    policy_lr: 0.0003
    target_entropy_ratio: 0.98
    tau: 0.005
  total_timesteps: 100000
  verbose: 1
