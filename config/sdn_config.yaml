# =============================================================================
# config/sdn_config.yaml
# SDN controller settings and failover priority.
# =============================================================================

controller:
  host: "127.0.0.1"
  port: 8080
  timeout_s: 1.0
  barrier_timeout_s: 1.0
  control_udp_ports: [9000]

# Expected wired topology used by the Ryu controller. A route is not reported
# ready until every switch has connected and returned its port inventory.
topology:
  expected_dpids: [1, 2, 3, 4, 5]
  ingress_dpid: 1
  egress_dpid: 5
  base_station_port: 4
  transit_dpids:
    direct: 2
    satellite: 3
    mesh: 4

# Deterministic failover priority order.
# System walks this list top-to-bottom until an available path is found.
failover_priority:
  - direct
  - satellite
  - mesh
  - fallback     # Hardcoded default; always available (mesh port pre-installed)

# Port mapping for each path on the OpenFlow switch (REAL mode only)
port_map:
  direct: 1
  satellite: 2
  mesh: 3
  fallback: 3    # fallback uses mesh port

# Historical dynamic priorities are retained so the controller can delete rules
# written by older versions. New dynamic routes all use the maximum value (100),
# preventing path choice from leaving an older higher-priority route active.
flow_priority:
  direct: 100
  satellite: 90
  mesh: 80
  fallback: 10   # lowest priority table-miss rule
  containment_allow: 300
  containment_drop: 290

# Drone ID, MAC, and access-port bindings live only in fleet_registry.yaml.

mock:
  log_to_file: true
  log_path: "logs/mock_sdn.log"

containment:
  # Align the first executable restriction with the detector's SUSPICIOUS
  # threshold; stronger evidence still escalates to control-only/quarantine.
  restricted_threshold: 0.35
  control_only_threshold: 0.72
  quarantine_threshold: 0.90
